name: Build VaderXboxBridge APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Build debug APK
        run: |
          test -f VaderXboxBridge-Prototype-Source.zip
          unzip -q VaderXboxBridge-Prototype-Source.zip -d source
          gradle --no-daemon --stacktrace -p source/VaderXboxBridge :app:assembleDebug
          test -f source/VaderXboxBridge/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vaderxboxbridge-debug-apk
          path: source/VaderXboxBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
