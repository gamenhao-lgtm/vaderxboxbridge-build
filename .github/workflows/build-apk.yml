name: Build VaderXboxBridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Source ZIP
      run: |
        unzip -q VaderXboxBridge-Prototype-Source.zip -d extracted_source
        echo "Listing extracted contents:"
        ls -la extracted_source

    - name: Build APK with Gradle
      run: |
        # Tự động tìm thư mục chứa gradlew bên trong kết quả giải nén
        PROJECT_DIR=$(find extracted_source -name "gradlew" -maxdepth 4 | xargs dirname)
        echo "Found project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vaderxboxbridge-debug-apk
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
