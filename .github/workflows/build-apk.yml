name: Build Vader Xbox Bridge 0.3.1 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unpack USB-direct source
        run: |
          test -f VaderXboxBridge-USB-Direct-v0.3.1-Source.zip
          unzip -q VaderXboxBridge-USB-Direct-v0.3.1-Source.zip -d source

      - name: Build debug APK with Gradle Wrapper
        run: |
          cd source/VaderXboxBridge
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vaderxboxbridge-usb-0.3.1-apk
          path: source/VaderXboxBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
