name: Build VaderXboxBridge USB Direct Test APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract Source ZIP
      run: |
        unzip -q VaderXboxBridge-USB-Direct-Source.zip -d extracted_source

    - name: Build APK with Gradle
      run: |
        cd extracted_source/VaderXboxBridge
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vaderxboxbridge-usb-direct-test-apk
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
        
