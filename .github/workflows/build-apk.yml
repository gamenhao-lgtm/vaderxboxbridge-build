name: Build Vader Xbox Bridge 0.3.1 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v4 no longer requests the retired SDK package named "tools".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'yes'

      - name: Install Android SDK components required by the project
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Unpack USB-direct source
        run: |
          test -f VaderXboxBridge-USB-Direct-Source.zip
          unzip -q VaderXboxBridge-USB-Direct-Source.zip -d source
          test -f source/VaderXboxBridge/settings.gradle.kts
          test -f source/VaderXboxBridge/app/src/main/java/com/example/vaderxboxbridge/MainActivity.kt

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace -p source/VaderXboxBridge :app:assembleDebug
          test -f source/VaderXboxBridge/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaderxboxbridge-usb-0.3.1-apk
          path: source/VaderXboxBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
