
name: Build Vader Xbox Bridge APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check source archive
        run: |
          test -f VaderXboxBridge-USB-Direct-Source.zip
          unzip -t VaderXboxBridge-USB-Direct-Source.zip

      - name: Unpack source
        run: |
          mkdir -p source
          unzip -q VaderXboxBridge-USB-Direct-Source.zip -d source
          test -f source/VaderXboxBridge/app/build.gradle.kts

      - name: Build debug APK
        run: |
          cd source/VaderXboxBridge
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vaderxboxbridge-debug-apk
          path: source/VaderXboxBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
