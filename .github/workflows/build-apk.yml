name: Build VaderXboxBridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Source ZIP
      run: |
        unzip VaderXboxBridge-Prototype-Source.zip -d extracted_source

    - name: Build APK with Gradle
      run: |
        cd extracted_source/VaderXboxBridge
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vaderxboxbridge-debug-apk
        path: extracted_source/VaderXboxBridge/app/build/outputs/apk/debug/app-debug.apk
